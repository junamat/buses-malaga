# =============================================================================
# Vía B — local-postgres (BACKEND_PROVIDER=local-postgres)
# -----------------------------------------------------------------------------
# Postgres + PostGIS PURO, SIN `pg_cron` ni `pg_net`. Es la pila mínima para
# correr la app y la suite de tests sin depender de Supabase ni de su Docker.
#
# En esta Vía:
#   - Se aplican las migraciones portables 0001 (esquema + PostGIS), 0003
#     (route_directions) y 0004 (datos de usuario con RLS), más la 0005
#     (credenciales de local-auth), exclusiva de esta Vía. La 0002 (pg_cron/pg_net) NO se aplica: esas
#     extensiones no existen en esta imagen y su ingesta la dispara el
#     adaptador `node-worker` + `POST /api/ingest`.
#   - La autenticación la cubre el adaptador `local-auth` (usuario de
#     desarrollo o usuarios de `npm run localauth:user`), no GoTrue.
#
# Las migraciones se montan en `/docker-entrypoint-initdb.d/`, que
# la imagen ejecuta automáticamente SOLO la primera vez que se crea el volumen
# de datos. Si cambias una migración, recrea el volumen: `npm run localpg:reset`.
#
# Arranque:   npm run localpg:up     (docker compose up -d)
# Parada:     npm run localpg:down   (docker compose down)
# Reset:      npm run localpg:reset  (down -v + up, re-aplica 0001+0003+0004+0005 desde cero)
#
# Validación estática sin demonio Docker: `docker compose config`.
# =============================================================================

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: buses-malaga-localpg
    restart: unless-stopped
    environment:
      # Credenciales de desarrollo. Coinciden con el DATABASE_URL de ejemplo:
      #   postgresql://postgres:postgres@127.0.0.1:5432/buses_malaga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buses_malaga
    ports:
      # host:container — el 5432 del host evita chocar con el 54322 de Vía A.
      - "5432:5432"
    volumes:
      # Datos persistentes entre reinicios (se borran con `down -v`).
      - buses_malaga_pgdata:/var/lib/postgresql/data
      # Migraciones portables 0001 (esquema + PostGIS) y 0003 (route_directions).
      # La 0002 (pg_cron/pg_net) se omite deliberadamente en esta Vía. El sufijo
      # numérico fija el orden de ejecución dentro de initdb.
      - ./db/migrations/0001_schema_gtfs_dominio.sql:/docker-entrypoint-initdb.d/0001_schema_gtfs_dominio.sql:ro
      - ./db/migrations/0003_route_directions_destinos.sql:/docker-entrypoint-initdb.d/0003_route_directions_destinos.sql:ro
      # Datos de usuario con RLS (0004) y credenciales del adaptador local-auth (0005).
      - ./db/migrations/0004_datos_usuario_rls.sql:/docker-entrypoint-initdb.d/0004_datos_usuario_rls.sql:ro
      - ./db/migrations/0005_local_auth.sql:/docker-entrypoint-initdb.d/0005_local_auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buses_malaga"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buses_malaga_pgdata:
